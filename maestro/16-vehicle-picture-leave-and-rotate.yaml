# An unsaved picture is dropped when the add screen is left, and survives a rotation, also while the crop screen is open.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- addMedia:
    - assets/photo-landscape.png
- tapOn:
    id: add_vehicle
- tapOn:
    id: vehicle_name
- inputText: Half typed
- hideKeyboard
# Rotating with the crop screen open keeps it open and the photo in it.
- runFlow: subflows/pick-photo.yaml
- setOrientation: LANDSCAPE_LEFT
- assertVisible: Crop the photo
- assertVisible: Use photo
- setOrientation: PORTRAIT
- assertVisible: Use photo
- tapOn: Use photo
- assertVisible: Change picture
# Rotating with a confirmed picture keeps the picture and what was typed.
- setOrientation: LANDSCAPE_LEFT
- assertVisible: Change picture
- assertVisible:
    id: remove_picture
- setOrientation: PORTRAIT
- assertVisible: Change picture
- assertVisible:
    id: vehicle_name
    text: Half typed
# Leaving without saving adds nothing.
- tapOn:
    id: back
- assertVisible:
    id: empty_state
