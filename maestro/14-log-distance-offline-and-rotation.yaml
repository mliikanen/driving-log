# Logging a distance works without a network and survives closing the app; the form survives a rotation.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- setAirplaneMode: enabled
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Family car
      PLATE: ABC-123
      UNIT: unit_KILOMETERS
      ODOMETER: "45200"
- runScript: subflows/yesterday.js
- tapOn: Family car
- tapOn:
    id: log_distance
- tapOn:
    id: odo_field
- inputText: "300"
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 45,500 km
# Close the app completely and open it again, without clearing its data.
- stopApp
- launchApp
- tapOn: Family car
- assertVisible:
    id: current_odometer
    text: 45,500 km
- assertVisible: +300 km
# The form keeps the way, the unit, the typed number, the day and the zone through a rotation.
- tapOn:
    id: log_distance
- tapOn:
    id: log_way_odometer
- tapOn:
    id: log_unit_mi
- tapOn:
    id: log_tenths
- tapOn:
    id: log_date
- tapOn: Switch to text input mode
- eraseText: 10
- inputText: ${output.yesterday}
- tapOn: OK
- tapOn:
    id: log_zone
- tapOn: Search
- inputText: tokyo
- tapOn: Asia/Tokyo
- tapOn:
    id: odo_field
- inputText: "12345"
- hideKeyboard
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: log_way_odometer
    checked: true
- assertVisible:
    id: log_unit_mi
    checked: true
- assertVisible:
    id: log_tenths
    checked: true
- assertVisible: ${output.yesterdayWeekday}
- assertVisible: Asia/Tokyo
- scrollUntilVisible:
    element:
      id: odo_field
    centerElement: true
- assertVisible:
    id: odo_field
    text: "1,234.5"
- setOrientation: PORTRAIT
- assertVisible:
    id: log_way_odometer
    checked: true
- assertVisible: ${output.yesterdayWeekday}
- assertVisible: Asia/Tokyo
- assertVisible:
    id: odo_field
    text: "1,234.5"
- setAirplaneMode: disabled
