# Logging distances: a trip distance, a new odometer count, another day and time zone. Run with: maestro/run.sh distance
#
# Explicit flow paths, not a "distance/*.yaml" glob: distance/view-existing-log.yaml needs a fixture seeded before
# it runs (see its .fixture file, docs/test-fixtures.md), which only run.sh's single-flow path
# ("run.sh distance view-existing-log") does. A glob here would silently sweep it into this whole-manifest run too,
# unseeded, and it would fail (confirmed: exactly that happened before this was made explicit).
flows:
  - "distance/log-distance.yaml"
  - "distance/log-from-home.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - log-distance
    - log-from-home
