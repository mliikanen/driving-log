# Logging distances: a trip distance, a new odometer count, another day and time zone, a reading scanned from a photo, and the camera
# refused or a photo unusable on the photo strip, the scanner and the review (ask-camera-for-camera-app). Run with: maestro/run.sh distance
#
# Explicit flow paths, not a "distance/*.yaml" glob: distance/view-existing-log.yaml needs a fixture seeded before
# it runs (see its .fixture file, docs/test-fixtures.md), which only run.sh's single-flow path
# ("run.sh distance view-existing-log") does. A glob here would silently sweep it into this whole-manifest run too,
# unseeded, and it would fail (confirmed: exactly that happened before this was made explicit).
flows:
  - "distance/setup.yaml"
  - "distance/log-distance.yaml"
  - "distance/log-from-home.yaml"
  - "distance/scan-reading.yaml"
  - "distance/photo-permission.yaml"
  - "distance/photo-errors.yaml"
  - "distance/scan-permission.yaml"
  - "distance/scan-errors.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - setup
    - log-distance
    - log-from-home
    - scan-reading
    - photo-permission
    - photo-errors
    - scan-permission
    - scan-errors
