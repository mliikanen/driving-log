# The date, time and time zone of an entry: the weekday, an earlier day typed into the date picker, a future day refused,
# another time zone from the searchable list, an entry dated before the initial odometer, and a new odometer count before it.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Family car
      PLATE: ABC-123
      UNIT: unit_KILOMETERS_TENTHS
      ODOMETER: "452003"
- runScript: subflows/yesterday.js
- tapOn: Family car
- tapOn:
    id: log_distance
# The date button shows the day of the week under the date.
- assertVisible: (Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)
# A future day is refused.
- tapOn:
    id: log_date
- tapOn: Switch to text input mode
- eraseText: 10
- inputText: ${output.tomorrow}
- tapOn: OK
- tapOn:
    id: odo_field
- inputText: "100"
- tapOn:
    id: save_entry
- assertVisible: The time cannot be in the future
# Yesterday: the weekday follows the date, the day is before the initial odometer, so no odometer is known and a new
# odometer count is saved as an odometer anchor.
- tapOn:
    id: log_date
- tapOn: Switch to text input mode
- eraseText: 10
- inputText: ${output.yesterday}
- tapOn: OK
- assertVisible: ${output.yesterdayWeekday}
- assertNotVisible: The time cannot be in the future
- tapOn:
    id: log_way_odometer
- assertVisible:
    id: log_no_known_odometer
- assertNotVisible:
    id: log_live_distance
- tapOn:
    id: log_way_distance
# Another time zone from the searchable list.
- tapOn:
    id: log_zone
- tapOn: Search
- inputText: new york
- tapOn: America/New_York
- assertVisible: America/New_York
# Saved before the initial odometer, in the zone it was entered in: the odometer is unchanged.
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 45,200.3 km
- assertVisible: +10.0 km
- assertVisible: ".*\\(America/New_York\\).*"
# A new odometer count for a time before the initial odometer is saved as an odometer anchor, not as a distance; it does
# not change the current odometer.
- tapOn:
    id: log_distance
- tapOn:
    id: log_date
- tapOn: Switch to text input mode
- eraseText: 10
- inputText: ${output.yesterday}
- tapOn: OK
- tapOn:
    id: log_way_odometer
- assertVisible:
    id: log_no_known_odometer
- tapOn:
    id: odo_field
- inputText: "440000"
- hideKeyboard
- assertNotVisible:
    id: log_live_distance
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 45,200.3 km
- assertVisible: Odometer reading
- assertVisible: 44,000.0 km
- assertVisible: +10.0 km
