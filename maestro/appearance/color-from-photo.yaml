# Happy path: a picture sets the color. Confirming the crop of a photo gives a selected "Photo color" under the palette; a preset can be chosen and the photo color chosen again;
# the saved vehicle shows its color as "Old color" on the edit screen; a new photo (here the second: a JPEG of a car) splits the row into "Old color" and "Photo color".
# (What color a photo gives is a unit test on the same files, RealPhotoColorJvmTest: Maestro cannot read a color. See docs/test-strategy.md.)
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- tapOn:
    id: add_vehicle
- scrollUntilVisible:
    element:
      id: vehicle_color_203A43
- assertNotVisible:
    id: vehicle_color_picture
- scrollUntilVisible:
    element:
      id: picture_preview
    direction: UP
- runFlow: ../subflows/pick-photo.yaml
- tapOn: Use photo
# The photo's color is the selected one, in a swatch of its own, and the default is not.
- scrollUntilVisible:
    element:
      id: vehicle_color_picture
- assertVisible:
    id: vehicle_color_picture
    checked: true
- assertVisible:
    id: vehicle_color_203A43
    checked: false
# A preset can be chosen instead, and the photo color chosen again.
- tapOn:
    id: vehicle_color_43A047
- assertVisible:
    id: vehicle_color_43A047
    checked: true
- assertVisible:
    id: vehicle_color_picture
    checked: false
- tapOn:
    id: vehicle_color_picture
- assertVisible:
    id: vehicle_color_picture
    checked: true
# Save the vehicle.
- scrollUntilVisible:
    element:
      id: vehicle_name
    direction: UP
- tapOn:
    id: vehicle_name
- inputText: Photo car
- hideKeyboard
- scrollUntilVisible:
    element:
      id: unit_KILOMETERS
    centerElement: true
- tapOn:
    id: unit_KILOMETERS
- scrollUntilVisible:
    element:
      id: odo_field
    centerElement: true
- tapOn:
    id: odo_field
- inputText: "1"
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible:
    id: add_vehicle
- tapOn: Photo car
- tapOn:
    id: edit_vehicle
# The saved color is not a preset, so the old color is the selected element, and nothing was taken from the picture on opening.
- scrollUntilVisible:
    element:
      id: vehicle_color_old
- assertVisible:
    id: vehicle_color_old
    checked: true
- assertNotVisible:
    id: vehicle_color_picture
# A new photo splits the row: the old color stays, the photo color joins it and is the selected one.
- scrollUntilVisible:
    element:
      id: picture_preview
    direction: UP
- runFlow:
    file: ../subflows/pick-photo.yaml
    env:
      PHOTO_INDEX: "1"
- tapOn: Use photo
- scrollUntilVisible:
    element:
      id: vehicle_color_picture
- assertVisible:
    id: vehicle_color_picture
    checked: true
- assertVisible:
    id: vehicle_color_old
    checked: false
