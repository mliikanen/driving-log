# Editing name and plate: trimming, clearing the plate, the name cannot be emptied, cancel keeps values,
# the odometer and unit cannot be edited, and the log is unchanged.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Family car
      PLATE: ABC-123
      UNIT: unit_KILOMETERS
      ODOMETER: "45200"
- tapOn: Family car
- tapOn:
    id: edit_vehicle
# The edit screen offers only name and plate, starting with the current values.
- assertVisible:
    id: vehicle_name
    text: Family car
- assertVisible:
    id: vehicle_plate
    text: ABC-123
- assertNotVisible:
    id: odo_field
- assertNotVisible:
    id: unit_choice
# The name cannot be emptied: the error shows and the screen stays.
- tapOn:
    id: vehicle_name
- eraseText: 20
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible: Enter a name
- assertVisible: Edit vehicle
# Whitespace-only name is refused as well.
- tapOn:
    id: vehicle_name
- inputText: "   "
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible: Enter a name
# Cancel keeps the previous values.
- tapOn:
    id: back
- assertVisible:
    id: vehicle_title
    text: Family car
# Change name and plate, with surrounding whitespace trimmed.
- tapOn:
    id: edit_vehicle
- tapOn:
    id: vehicle_name
- eraseText: 20
- inputText: " Estate car "
- tapOn:
    id: vehicle_plate
- eraseText: 20
- inputText: "XYZ-789 "
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible:
    id: edit_vehicle
- assertVisible:
    id: vehicle_title
    text: Estate car
- assertVisible:
    id: vehicle_plate
    text: XYZ-789
# The odometer is unchanged.
- assertVisible:
    id: current_odometer
    text: 45,200 km
# The list shows the new values too.
- tapOn:
    id: back
- assertVisible: Estate car
- assertVisible: XYZ-789
- assertNotVisible: Family car
# Remove the plate.
- tapOn: Estate car
- tapOn:
    id: edit_vehicle
- tapOn:
    id: vehicle_plate
- eraseText: 20
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible:
    id: edit_vehicle
- assertNotVisible:
    id: vehicle_plate
# The log has the same single event as before.
- tapOn:
    id: view_log
- assertVisible: Initial odometer
- assertVisible: 45,200 km
- assertNotVisible:
    id: log_event
    index: 1
