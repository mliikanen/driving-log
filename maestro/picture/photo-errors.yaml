# What isn't a missing permission never shows the missing-permission message (ask-camera-for-camera-app): leaving the chooser, leaving the
# camera app without a photo, and a photo that can't be opened, which shows its own error without "Open settings". The flow allows the
# camera at launch: whether access is allowed has nothing to do with these cases. Needs setup.yaml's photos (the broken one is the second).
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
    permissions:
      all: unset
      camera: allow
- tapOn:
    id: landing_vehicles
# Leaving the chooser: nothing changes, no message.
- tapOn:
    id: picture_preview
- extendedWaitUntil:
    visible: Media
    timeout: 20000
- pressKey: back
- waitForAnimationToEnd
- assertVisible: Add picture
- assertNotVisible:
    id: permission_missing
- assertNotVisible:
    id: picture_error
# Leaving the camera app without a photo: nothing changes, no message.
- tapOn:
    id: picture_preview
- extendedWaitUntil:
    visible: Camera
    timeout: 20000
- tapOn: Camera
- extendedWaitUntil:
    visible: Shutter
    timeout: 30000
- pressKey: back
- waitForAnimationToEnd
- assertVisible: Add picture
- assertNotVisible:
    id: permission_missing
- assertNotVisible:
    id: picture_error
# A photo that can't be opened: its own error, no "Open settings".
- tapOn:
    id: picture_preview
- extendedWaitUntil:
    visible: Media
    timeout: 20000
- tapOn: Media
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 12000
- tapOn:
    text: "Photo taken on.*"
    index: 1
- extendedWaitUntil:
    visible:
      id: picture_error
    timeout: 20000
- assertVisible: "The picture could not be opened"
- assertNotVisible:
    id: permission_missing
- assertNotVisible:
    id: permission_open_settings
