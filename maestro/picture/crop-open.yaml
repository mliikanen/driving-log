# Step 7 of run.sh: opens the crop screen and zooms in twice, so the photo can be dragged (run.sh then swipes over it with adb and compares screenshots).
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- setOrientation: PORTRAIT
# A fresh start is the Home screen with no vehicle: its first tile, "Add vehicle", opens the add screen.
- tapOn:
    id: landing_vehicles
- runFlow: ../subflows/pick-photo.yaml
- assertVisible: Crop the photo
- tapOn: Zoom in
- tapOn: Zoom in
