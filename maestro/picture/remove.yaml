# Step 3 of run.sh: the picture of the vehicle is removed.
appId: com.mikonoma.drivinglog
---
- launchApp
- runFlow: ../subflows/open-vehicles.yaml
- assertVisible: Family car
- tapOn: Family car
- tapOn:
    id: edit_vehicle
- tapOn:
    id: remove_picture
- tapOn:
    id: save_vehicle
- assertNotVisible: Picture of Family car
# The icon of the vehicle's type is shown again, on the details screen and in the list.
- assertVisible: "Vehicle type: Car"
- tapOn:
    id: back
- assertVisible: "Vehicle type: Car"
