# Step 6 of run.sh: the crop screen's controls. The app bar has its back arrow and "Use photo", and the buttons zoom, turn and reset; the crop screen stays open with its controls when the
# device is rotated; back navigation cancels the crop and leaves the form as it was; a turned crop is confirmed and the form shows the picture. (What each button does to the frame
# is a unit test of CropState: see docs/test-strategy.md.)
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
# A fresh start is the Home screen with no vehicle: its first tile, "Add vehicle", opens the add screen.
- tapOn:
    id: landing_vehicles
- runFlow: ../subflows/pick-photo.yaml
- assertVisible: Crop the photo
- assertVisible: Back
- assertVisible: Use photo
- assertVisible: Zoom in
- assertVisible: Zoom out
- assertVisible: Rotate photo
- assertVisible: Reset
# Zoom in, zoom out, turn, reset: the screen stays as it is.
- tapOn: Zoom in
- tapOn: Zoom in
- tapOn: Zoom out
- tapOn: Rotate photo
- tapOn: Reset
- tapOn: Zoom in
- tapOn: Rotate photo
# Rotating the device keeps the crop screen open with its controls, in both layouts.
- setOrientation: LANDSCAPE_LEFT
- assertVisible: Crop the photo
- assertVisible: Zoom in
- assertVisible: Rotate photo
- assertVisible: Use photo
- setOrientation: PORTRAIT
- assertVisible: Zoom in
- assertVisible: Rotate photo
# Back navigation cancels the crop: the form is as it was.
- tapOn: Back
- assertVisible: Add picture
- assertNotVisible:
    id: remove_picture
# A turned crop is confirmed.
- runFlow: ../subflows/pick-photo.yaml
- tapOn: Rotate photo
- tapOn: Use photo
- assertVisible: Change picture
- assertVisible:
    id: remove_picture
