# Step 1 of run.sh: a vehicle is added with a picture (clears the app's data first); the list shows the picture instead of the icon of the type, and the details screen the large one.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
# A fresh start is the Home screen with no vehicle: its first tile, "Add vehicle", opens the add screen.
- tapOn:
    id: landing_vehicles
- runFlow: ../subflows/pick-photo.yaml
- tapOn: Use photo
- assertVisible:
    id: picture_badge
- tapOn:
    id: vehicle_name
- inputText: Family car
- hideKeyboard
- scrollUntilVisible:
    element:
      id: unit_KILOMETERS
    centerElement: true
- tapOn:
    id: unit_KILOMETERS
- scrollUntilVisible:
    element:
      id: odo_field
    centerElement: true
- tapOn:
    id: odo_field
- inputText: "45200"
- hideKeyboard
- tapOn:
    id: save_vehicle
# Back on the Home screen, whose first tile is now "Vehicles".
- tapOn:
    id: landing_vehicles
- assertVisible:
    id: vehicle_picture
- assertNotVisible: "Vehicle type: Car"
- tapOn: Family car
- assertVisible: Picture of Family car
- assertVisible:
    id: vehicle_picture_large
