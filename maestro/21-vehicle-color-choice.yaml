# The color choice on the add and edit screens: the default is selected first, choosing replaces it, it survives a rotation, it is saved with the vehicle,
# shown selected on the edit screen, changed there, dropped when leaving without saving, and it survives closing the app.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- tapOn:
    id: add_vehicle
- scrollUntilVisible:
    element:
      id: vehicle_color_E53935
# The default (Petroleum) is the selected color, and there is no picture color yet.
- assertVisible:
    id: vehicle_color_203A43
    checked: true
- assertVisible:
    id: vehicle_color_E53935
    checked: false
- assertNotVisible:
    id: vehicle_color_picture
# Choosing replaces the choice.
- tapOn:
    id: vehicle_color_E53935
- assertVisible:
    id: vehicle_color_E53935
    checked: true
- assertVisible:
    id: vehicle_color_203A43
    checked: false
- tapOn:
    id: vehicle_color_1E88E5
- assertVisible:
    id: vehicle_color_1E88E5
    checked: true
- assertVisible:
    id: vehicle_color_E53935
    checked: false
# The choice survives a rotation.
- setOrientation: LANDSCAPE_LEFT
- scrollUntilVisible:
    element:
      id: vehicle_color_1E88E5
- assertVisible:
    id: vehicle_color_1E88E5
    checked: true
- setOrientation: PORTRAIT
- scrollUntilVisible:
    element:
      id: vehicle_color_1E88E5
- assertVisible:
    id: vehicle_color_1E88E5
    checked: true
- tapOn:
    id: back
- assertVisible: No vehicles yet
# A vehicle is saved with its color.
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Blue car
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      COLOR: 1E88E5
- tapOn: Blue car
- tapOn:
    id: edit_vehicle
- scrollUntilVisible:
    element:
      id: vehicle_color_1E88E5
- assertVisible:
    id: vehicle_color_1E88E5
    checked: true
# Leaving the edit screen without saving keeps the saved color.
# The old color is always there on the edit screen (here the blue preset, so the palette shows it selected and the old color is not); it takes the choice back.
- assertVisible:
    id: vehicle_color_old
    checked: false
- tapOn:
    id: vehicle_color_43A047
- assertVisible:
    id: vehicle_color_43A047
    checked: true
- tapOn:
    id: vehicle_color_old
- assertVisible:
    id: vehicle_color_1E88E5
    checked: true
- tapOn:
    id: vehicle_color_43A047
- tapOn:
    id: back
- tapOn:
    id: edit_vehicle
- scrollUntilVisible:
    element:
      id: vehicle_color_1E88E5
- assertVisible:
    id: vehicle_color_1E88E5
    checked: true
# Changing the color and saving shows it selected the next time.
- tapOn:
    id: vehicle_color_E53935
- tapOn:
    id: save_vehicle
- assertVisible:
    id: vehicle_title
# The color survives closing the app completely.
- stopApp
- launchApp
- tapOn: Blue car
- tapOn:
    id: edit_vehicle
- scrollUntilVisible:
    element:
      id: vehicle_color_E53935
- assertVisible:
    id: vehicle_color_E53935
    checked: true
