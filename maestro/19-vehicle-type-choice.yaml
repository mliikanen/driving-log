# The type choice on the add screen: Car is preselected, the choice can be changed and survives a rotation, and a vehicle of each of
# the eight types shows its type's icon in the list (the item's description is "Vehicle type: <name>").
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- tapOn:
    id: add_vehicle
# Car is selected and the others are not.
- assertVisible:
    id: vehicle_type_CAR
    checked: true
- assertVisible:
    id: vehicle_type_MOTORCYCLE
    checked: false
# Choosing another tile replaces the choice.
- tapOn:
    id: vehicle_type_MOTORCYCLE
- assertVisible:
    id: vehicle_type_MOTORCYCLE
    checked: true
- assertVisible:
    id: vehicle_type_CAR
    checked: false
- tapOn:
    id: vehicle_type_SCOOTER
- assertVisible:
    id: vehicle_type_SCOOTER
    checked: true
- assertVisible:
    id: vehicle_type_MOTORCYCLE
    checked: false
# The choice survives a rotation.
- tapOn:
    id: vehicle_type_BUS
- setOrientation: LANDSCAPE_LEFT
- scrollUntilVisible:
    element:
      id: vehicle_type_BUS
    direction: DOWN
- assertVisible:
    id: vehicle_type_BUS
    checked: true
- setOrientation: PORTRAIT
- scrollUntilVisible:
    element:
      id: vehicle_type_BUS
    direction: UP
- assertVisible:
    id: vehicle_type_BUS
    checked: true
- tapOn:
    id: back
# A vehicle of each type, added with that type, shows its icon in the list.
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Car vehicle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: CAR
- assertVisible: "Vehicle type: Car"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: SUV vehicle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: SUV
- assertVisible: "Vehicle type: SUV"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Van vehicle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: VAN
- assertVisible: "Vehicle type: Van"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Truck vehicle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: TRUCK
- assertVisible: "Vehicle type: Truck"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Bus vehicle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: BUS
- assertVisible: "Vehicle type: Bus"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Motorcycle vehicle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: MOTORCYCLE
- assertVisible: "Vehicle type: Motorcycle"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Scooter vehicle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: SCOOTER
- assertVisible: "Vehicle type: Scooter"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Other vehicle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: OTHER
- assertVisible: "Vehicle type: Other"
