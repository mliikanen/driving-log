# The odometer is required and starts empty. Add a vehicle with a name, the preselected default unit and a typed zero.
# The emulator region is the United States, so the preselected unit is Miles.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- tapOn:
    id: add_vehicle
- assertVisible:
    id: unit_MILES
    checked: true
# The odometer field starts empty: no 0 and no 0.0 (a text of one or more characters must not be there).
- assertVisible:
    id: odo_field
- assertNotVisible:
    id: odo_field
    text: ".+"
# Saving without an odometer is refused and nothing is saved.
- tapOn:
    id: vehicle_name
- inputText: Van
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible: Enter the odometer reading
- assertVisible: Add vehicle
# A typed zero is a valid reading and clears the error.
- tapOn:
    id: odo_field
- inputText: "0"
- assertNotVisible: Enter the odometer reading
- assertVisible:
    id: odo_field
    text: "0"
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible:
    id: add_vehicle
- assertVisible: Van
- tapOn: Van
- assertVisible:
    id: current_odometer
    text: 0 mi
- assertNotVisible:
    id: vehicle_plate
