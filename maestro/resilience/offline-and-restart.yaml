# Happy path: with the network off, add a vehicle with a picture, log a distance and edit the vehicle; close the app completely and open it again: everything is still there.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- setAirplaneMode: enabled
- runFlow:
    file: ../subflows/add-vehicle.yaml
    env:
      NAME: Family car
      PLATE: ABC-123
      UNIT: unit_KILOMETERS
      ODOMETER: "45200"
      PICTURE: "true"
- assertVisible:
    id: vehicle_picture
- tapOn: Family car
- tapOn:
    id: log_distance
- tapOn:
    id: odo_field
- inputText: "300"
- hideKeyboard
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 45,500 km
- tapOn:
    id: edit_vehicle
- tapOn:
    id: vehicle_name
- eraseText: 20
- inputText: Estate car
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible:
    id: vehicle_title
    text: Estate car
# Close the app completely and open it again, without clearing its data.
- stopApp
- launchApp
# The app starts on the Home screen: the vehicles are one tap away.
- runFlow: ../subflows/open-vehicles.yaml
- assertVisible:
    id: vehicle_picture
- assertVisible: Estate car
- assertVisible: ABC-123
- tapOn: Estate car
- assertVisible: Picture of Estate car
- assertVisible:
    id: current_odometer
    text: 45,500 km
- scrollUntilVisible:
    element:
      text: "+300 km"
- assertVisible: +300 km
- setAirplaneMode: disabled
