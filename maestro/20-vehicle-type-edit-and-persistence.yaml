# The type can be changed on the edit screen (and changing it is dropped when leaving without saving), the list and the details screen
# follow it, and it survives closing the app.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Hauler
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
      TYPE: TRUCK
- assertVisible: "Vehicle type: Truck"
- tapOn: Hauler
- assertVisible: "Vehicle type: Truck"
# The edit screen starts with the saved type. Choosing another one and leaving keeps the saved type.
- tapOn:
    id: edit_vehicle
- assertVisible:
    id: vehicle_type_TRUCK
    checked: true
- tapOn:
    id: vehicle_type_SCOOTER
- tapOn:
    id: back
- assertVisible: "Vehicle type: Truck"
# Changing the type and saving shows it on the details screen and in the list.
- tapOn:
    id: edit_vehicle
- tapOn:
    id: vehicle_type_BUS
- tapOn:
    id: save_vehicle
- assertVisible: "Vehicle type: Bus"
- tapOn:
    id: back
- assertVisible: "Vehicle type: Bus"
- assertNotVisible: "Vehicle type: Truck"
# The type survives closing the app completely.
- stopApp
- launchApp
- assertVisible: "Vehicle type: Bus"
- tapOn: Hauler
- tapOn:
    id: edit_vehicle
- assertVisible:
    id: vehicle_type_BUS
    checked: true
