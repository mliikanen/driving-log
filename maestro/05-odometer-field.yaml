# The microwave-style odometer field: it starts empty, digits enter from the right, backspace removes the last digit.
# Run with the emulator locale English (United States): the decimal separator is ".".
# "Empty" is asserted as: no text of one or more characters in the field (not 0, not 0.0).
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- tapOn:
    id: add_vehicle
- tapOn:
    id: unit_KILOMETERS_TENTHS
- scrollUntilVisible:
    element:
      id: odo_field
- tapOn:
    id: odo_field
- assertNotVisible:
    id: odo_field
    text: ".+"
# 1, 2, 3 shows 0.1, 1.2, 12.3
- inputText: "1"
- assertVisible:
    id: odo_field
    text: "0.1"
- inputText: "2"
- assertVisible:
    id: odo_field
    text: "1.2"
- inputText: "3"
- assertVisible:
    id: odo_field
    text: "12.3"
# Backspace restores the earlier value: 12.3 -> 1.2 -> 0.1 -> empty -> empty
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "1.2"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.1"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
# 1.2, then 3, then backspace: 12.3 and back to 1.2
- inputText: "12"
- assertVisible:
    id: odo_field
    text: "1.2"
- inputText: "3"
- assertVisible:
    id: odo_field
    text: "12.3"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "1.2"
# Clear empties the field
- tapOn:
    id: odo_clear
- assertNotVisible:
    id: odo_field
    text: ".+"
# 1, 2, BKSP, BKSP, 2, 3, 0 shows 0.1, 1.2, 0.1, (empty), 0.2, 2.3, 23.0
- scrollUntilVisible:
    element:
      id: odo_field
- tapOn:
    id: odo_field
- inputText: "1"
- assertVisible:
    id: odo_field
    text: "0.1"
- inputText: "2"
- assertVisible:
    id: odo_field
    text: "1.2"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.1"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
- inputText: "2"
- assertVisible:
    id: odo_field
    text: "0.2"
- inputText: "3"
- assertVisible:
    id: odo_field
    text: "2.3"
- inputText: "0"
- assertVisible:
    id: odo_field
    text: "23.0"
# Changing the unit keeps the number: 23.0 -> Kilometers shows 23, back shows 23.0
- tapOn:
    id: unit_KILOMETERS
- assertVisible:
    id: odo_field
    text: "23"
- tapOn:
    id: unit_KILOMETERS_TENTHS
- assertVisible:
    id: odo_field
    text: "23.0"
# An empty field stays empty when the unit changes
- tapOn:
    id: odo_clear
- tapOn:
    id: unit_MILES
- assertNotVisible:
    id: odo_field
    text: ".+"
# A typed zero is a reading: 0.0 for a tenths unit, and backspace empties it again
- tapOn:
    id: unit_KILOMETERS_TENTHS
- scrollUntilVisible:
    element:
      id: odo_field
- tapOn:
    id: odo_field
- inputText: "0"
- assertVisible:
    id: odo_field
    text: "0.0"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
# Whole-number units fill from the right too: 1, 12, 123
- tapOn:
    id: unit_KILOMETERS
- scrollUntilVisible:
    element:
      id: odo_field
- tapOn:
    id: odo_field
- inputText: "1"
- assertVisible:
    id: odo_field
    text: "1"
- inputText: "2"
- assertVisible:
    id: odo_field
    text: "12"
- inputText: "3"
- assertVisible:
    id: odo_field
    text: "123"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "12"
- eraseText: 2
- assertNotVisible:
    id: odo_field
    text: ".+"
# Zero at zero stays zero
- inputText: "000"
- assertVisible:
    id: odo_field
    text: "0"
# The maximum length: further digits are ignored
- tapOn:
    id: odo_clear
- scrollUntilVisible:
    element:
      id: odo_field
- tapOn:
    id: odo_field
- inputText: "99999999"
- assertVisible:
    id: odo_field
    text: 9,999,999
# A first typed zero is kept as an unshown prefix, so backspace undoes exactly what was typed.
# Tenths unit: 0, 5, 3 shows 0.0, 0.5, 5.3 and backspace goes 0.5, 0.0, empty
- tapOn:
    id: odo_clear
- tapOn:
    id: unit_KILOMETERS_TENTHS
- scrollUntilVisible:
    element:
      id: odo_field
- tapOn:
    id: odo_field
- inputText: "0"
- assertVisible:
    id: odo_field
    text: "0.0"
- inputText: "5"
- assertVisible:
    id: odo_field
    text: "0.5"
- inputText: "3"
- assertVisible:
    id: odo_field
    text: "5.3"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.5"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.0"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
# Further leading zeros are ignored: 0, 0, 0, 5 shows 0.0, 0.0, 0.0, 0.5 and backspace goes 0.0, empty
- inputText: "000"
- assertVisible:
    id: odo_field
    text: "0.0"
- inputText: "5"
- assertVisible:
    id: odo_field
    text: "0.5"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.0"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
# A zero that is not typed first is an ordinary digit: 1, 0 shows 0.1, 1.0 and backspace goes 0.1
- inputText: "10"
- assertVisible:
    id: odo_field
    text: "1.0"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.1"
# A leading zero typed in one go (like a paste) behaves the same: 053 shows 5.3, then 0.5, 0.0, empty
- tapOn:
    id: odo_clear
- scrollUntilVisible:
    element:
      id: odo_field
- tapOn:
    id: odo_field
- inputText: "053"
- assertVisible:
    id: odo_field
    text: "5.3"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.5"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.0"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
# Whole-number unit: 0, 5 shows 0, 5 (no extra zero drawn) and backspace goes 0, empty
- tapOn:
    id: unit_KILOMETERS
- scrollUntilVisible:
    element:
      id: odo_field
- tapOn:
    id: odo_field
- inputText: "0"
- assertVisible:
    id: odo_field
    text: "0"
- inputText: "5"
- assertVisible:
    id: odo_field
    text: "5"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
# Changing the unit drops the prefix: 0, 5 in Kilometers becomes 5.0, then backspace goes 0.5, empty
- inputText: "05"
- assertVisible:
    id: odo_field
    text: "5"
- tapOn:
    id: unit_KILOMETERS_TENTHS
- assertVisible:
    id: odo_field
    text: "5.0"
- eraseText: 1
- assertVisible:
    id: odo_field
    text: "0.5"
- eraseText: 1
- assertNotVisible:
    id: odo_field
    text: ".+"
