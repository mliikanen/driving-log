# One vehicle per odometer unit: the same digits read differently in each unit.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: A Kilometers
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "45200"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: B Kilometers with 100 m
      PLATE: ""
      UNIT: unit_KILOMETERS_TENTHS
      ODOMETER: "452003"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: C Miles
      PLATE: ""
      UNIT: unit_MILES
      ODOMETER: "45200"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: D Miles with tenths
      PLATE: ""
      UNIT: unit_MILES_TENTHS
      ODOMETER: "452003"
- tapOn: A Kilometers
- assertVisible:
    id: current_odometer
    text: 45,200 km
- tapOn:
    id: back
- tapOn: B Kilometers with 100 m
- assertVisible:
    id: current_odometer
    text: 45,200.3 km
- tapOn:
    id: back
- tapOn: C Miles
- assertVisible:
    id: current_odometer
    text: 45,200 mi
- tapOn:
    id: back
- tapOn: D Miles with tenths
- assertVisible:
    id: current_odometer
    text: 45,200.3 mi
