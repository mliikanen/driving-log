# Adding a picture works without a network and the picture survives closing the app.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- setAirplaneMode: enabled
- addMedia:
    - assets/photo-landscape.png
- tapOn:
    id: add_vehicle
- runFlow: subflows/pick-photo.yaml
- tapOn: Use photo
- tapOn:
    id: vehicle_name
- inputText: Family car
- hideKeyboard
- tapOn:
    id: unit_KILOMETERS
- tapOn:
    id: odo_field
- inputText: "45200"
- hideKeyboard
- tapOn:
    id: save_vehicle
- assertVisible:
    id: vehicle_picture
# Close the app completely and open it again, without clearing its data.
- stopApp
- launchApp
- assertVisible:
    id: vehicle_picture
- tapOn: Family car
- assertVisible: Picture of Family car
- setAirplaneMode: disabled
