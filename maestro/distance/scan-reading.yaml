# Happy path of scanning a reading. "Scan a reading" opens the live scanner (add-live-scanner) after the camera
# permission is granted; closing it leaves the form as it was. From the scanner's photo button, scan a car cluster photo,
# accept its odometer reading and save (add-odometer-ocr-capture): the form switches to "New odometer" with the value
# read. Then the same for a motorcycle's seven-segment LCD (add-seven-segment-ocr), and a new vehicle whose current
# odometer is scanned on the add-vehicle form (scan-initial-odometer). Last, a refueling's fuel amount, scanned via
# that field's own action (add-fuel-amount-ocr) — save/leave and permission are unchanged from the odometer/trip
# cases above, so that case only confirms the field and its unit. The emulator's camera cannot show a
# dashboard, so live readings are checked on the JVM (LiveFramesJvmTest) and on a phone, not here. Cases (classification, other ways, what is kept
# on save or leave) are unit tests: see docs/test-strategy.md. The stored photo and detections are never shown, so
# nothing here asserts them.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
    # Maestro grants every permission by default; unset, the camera is asked for when "Scan a reading" is tapped.
    permissions:
      camera: unset
- runFlow:
    file: ../subflows/add-vehicle.yaml
    env:
      NAME: Scan car
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "71000"
- tapOn: Scan car
- tapOn:
    id: log_event
- assertVisible:
    id: log_way_distance
    checked: true
- tapOn:
    id: scan_reading
- extendedWaitUntil:
    visible: "While using the app"
    timeout: 10000
- tapOn: "While using the app"
- assertVisible:
    id: scanner
# Leaving the scanner without a reading, with the system back: the form as it was.
- pressKey: back
- assertVisible:
    id: log_way_distance
    checked: true
- assertVisible:
    id: scan_reading
# The photo flow, from the scanner's photo button.
- tapOn:
    id: scan_reading
- tapOn:
    id: scanner_photo
- extendedWaitUntil:
    visible: Media
    timeout: 20000
- tapOn: Media
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 12000
# The cluster photo is uploaded last by setup.yaml, so it is the newest: the picker lists it first.
- tapOn:
    text: "Photo taken on.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: scan_review
    timeout: 20000
# The system back on the review returns to the scanner; choose the photo again.
- pressKey: back
- assertVisible:
    id: scanner
- tapOn:
    id: scanner_photo
- extendedWaitUntil:
    visible: Media
    timeout: 20000
- tapOn: Media
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 12000
- tapOn:
    text: "Photo taken on.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: scan_review
    timeout: 20000
- assertVisible: "Tap the reading to use."
- tapOn: "ODO 71140"
- tapOn:
    id: scan_use
# The odometer reading switched the form to "New odometer" and filled it in.
- assertVisible:
    id: log_way_odometer
    checked: true
- assertVisible:
    id: odo_field
    text: "71,140"
- assertVisible:
    id: log_live_distance
    text: "Distance: 140 km"
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 71,140 km
# A motorcycle's LCD odometer, "ODO 5034 Km", in seven-segment digits.
- tapOn:
    id: back
- runFlow:
    file: ../subflows/add-vehicle.yaml
    env:
      NAME: Scan motorcycle
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "5000"
      TYPE: MOTORCYCLE
- tapOn: Scan motorcycle
- tapOn:
    id: log_event
- tapOn:
    id: scan_reading
- tapOn:
    id: scanner_photo
- extendedWaitUntil:
    visible: Media
    timeout: 20000
- tapOn: Media
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 12000
# The LCD photo is uploaded just before the car cluster by setup.yaml: the picker's second photo.
- tapOn:
    text: "Photo taken on.*"
    index: 1
- extendedWaitUntil:
    visible:
      id: scan_review
    timeout: 20000
- tapOn: "ODO 5034"
- tapOn:
    id: scan_use
- assertVisible:
    id: log_way_odometer
    checked: true
- assertVisible:
    id: odo_field
    text: "5,034"
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 5,034 km
# A new vehicle's current odometer, scanned on the add-vehicle form from the car cluster photo (the picker's first).
- tapOn:
    id: back
- tapOn:
    id: add_vehicle
- tapOn:
    id: vehicle_name
- inputText: Scanned car
- hideKeyboard
# The preselected unit follows the region (miles in the United States); this vehicle counts kilometers.
- scrollUntilVisible:
    element:
      id: unit_KILOMETERS
- tapOn:
    id: unit_KILOMETERS
- scrollUntilVisible:
    element:
      id: scan_reading
- tapOn:
    id: scan_reading
- assertVisible:
    id: scanner
- tapOn:
    id: scanner_photo
- extendedWaitUntil:
    visible: Media
    timeout: 20000
- tapOn: Media
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 12000
- tapOn:
    text: "Photo taken on.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: scan_review
    timeout: 20000
- tapOn: "ODO 71140"
- tapOn:
    id: scan_use
# Back on the add form, with the odometer filled in and the name as typed.
- assertVisible:
    id: odo_field
    text: "71,140"
- assertVisible: Scanned car
- tapOn:
    id: save_vehicle
# The list, once the add screen has gone: until then "Scanned car" is also the add form's name field.
- extendedWaitUntil:
    visible:
      id: add_vehicle
    timeout: 10000
- tapOn: Scanned car
- assertVisible:
    id: current_odometer
    text: 71,140 km
# A refueling's fuel amount, scanned via that field's own action — a separate "Scan a reading" from the mileage
# section's, both visible on a refueling entry at once (index 0 is the fuel-amount one, declared first in the
# form). Save/leave and permission are unchanged from the odometer/trip cases above, so this only confirms the
# field and its unit (add-fuel-amount-ocr).
- tapOn:
    id: log_event
- tapOn:
    id: log_kind_selector
- tapOn: Refueling
- tapOn:
    id: scan_reading
    index: 0
- tapOn:
    id: scanner_photo
- extendedWaitUntil:
    visible: Media
    timeout: 20000
- tapOn: Media
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 12000
# The fuel pump photo is uploaded first by setup.yaml, so it is the oldest: the picker's last photo (index 4 of the
# five it has added by now).
- tapOn:
    text: "Photo taken on.*"
    index: 4
- extendedWaitUntil:
    visible:
      id: scan_review
    timeout: 20000
- tapOn: "FUEL 7.82"
- tapOn:
    id: scan_use
- assertVisible:
    id: fuel_amount_field
    text: "7.82"
- assertVisible:
    id: fuel_unit_liters
    checked: true
