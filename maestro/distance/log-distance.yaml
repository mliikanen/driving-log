# Happy path: log a trip distance, log a new odometer count, and log a distance for an earlier day in another time zone; the details and the full log show them.
# Cases (validation messages, a future moment, before the initial odometer, the unit choices and what is remembered) are unit tests: see docs/test-strategy.md.
# Run with the emulator locale English (United States): readings are checked with "," thousands separators and dates are typed as MMDDYYYY.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/add-vehicle.yaml
    env:
      NAME: Family car
      PLATE: ABC-123
      UNIT: unit_KILOMETERS_TENTHS
      ODOMETER: "452003"
- runScript: ../subflows/yesterday.js
- tapOn: Family car
- assertVisible:
    id: current_odometer
    text: 45,200.3 km
# By trip distance (the way that is preselected): 100.5 km.
- tapOn:
    id: log_event
- assertVisible: Log event
- assertVisible:
    id: log_kind_selector
    text: Distance
    enabled: false
- assertVisible:
    id: log_way_distance
    checked: true
- tapOn:
    id: odo_field
- inputText: "1005"
- hideKeyboard
- assertVisible:
    id: odo_field
    text: "100.5"
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 45,300.8 km
- scrollUntilVisible:
    element:
      text: "+100.5 km"
- assertVisible: +100.5 km
# By a new odometer count: the known odometer includes the distance just logged, and the distance is shown live.
- tapOn:
    id: log_event
- tapOn:
    id: log_way_odometer
- assertVisible:
    id: log_known_odometer
    text: "Previous known odometer: 45,300.8 km"
- tapOn:
    id: odo_field
- inputText: "453208"
- hideKeyboard
- assertVisible:
    id: log_live_distance
    text: "Distance: 20.0 km"
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 45,320.8 km
- scrollUntilVisible:
    element:
      text: "+20.0 km"
- assertVisible: +20.0 km
# For yesterday, in another time zone chosen from the searchable list (the date picker takes the digits typed).
- tapOn:
    id: log_event
- tapOn:
    id: log_date
- tapOn: Switch to text input mode
- eraseText: 10
- inputText: ${output.yesterday}
- tapOn: OK
- assertVisible: ${output.yesterdayWeekday}
- tapOn:
    id: log_zone
- tapOn: Search
- inputText: new york
- tapOn: America/New_York
- assertVisible: America/New_York
- tapOn:
    id: odo_field
- inputText: "100"
- hideKeyboard
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
- scrollUntilVisible:
    element:
      text: "+10.0 km"
- assertVisible: ".*\\(America/New_York\\).*"
# The full log lists all of it.
- scrollUntilVisible:
    element:
      id: view_log
- tapOn:
    id: view_log
- assertVisible: +10.0 km
- assertVisible: +20.0 km
- assertVisible: +100.5 km
- assertVisible: Initial odometer
- tapOn:
    id: back
# A note: styled like the form's other fields, a full-screen editor, a discarded edit changes nothing, a trash-can action needs confirmation.
# The note element's own accessible text does not surface to this environment's UiAutomator-based dump (a known
# limitation, the same class of issue the Material3 AlertDialog buttons hit in add-event-notes) — its content is
# asserted by plain text instead of the usual id+text pair; tapping by id is unaffected and still used throughout.
- tapOn:
    id: log_event
- assertVisible: Add a note...
- tapOn:
    id: log_note
- inputText: never saved
- tapOn:
    id: note_editor_discard
- assertVisible: Add a note...
- tapOn:
    id: log_note
- inputText: borrowed to Sam
- tapOn:
    id: back
- assertVisible: borrowed to Sam
- tapOn:
    id: log_note_remove
- tapOn: Cancel
- assertVisible: borrowed to Sam
- tapOn:
    id: log_note_remove
- tapOn: Remove
- assertVisible: Add a note...
- assertNotVisible:
    id: log_note_remove
# Add it again and save; its row shows the note icon on the details screen and in the full log.
- tapOn:
    id: log_note
- inputText: borrowed to Sam
- tapOn:
    id: back
- tapOn:
    id: odo_field
- inputText: "10"
- hideKeyboard
- tapOn:
    id: save_entry
- assertVisible:
    id: event_note_icon
- scrollUntilVisible:
    element:
      id: view_log
    centerElement: true
# Root cause, confirmed via `adb shell dumpsys window` and screenshots: at this point the log has all 5 recent
# events (the display cap), so "View full log" sits at its lowest possible scroll position — within a few px of
# the device's bottom `mandatorySystemGestures` inset (`frame=[0,2316][1080,2400]` on this 2400px-tall emulator,
# button bounds `[42,2299][1038,2400]` without centering), where taps are not reliably delivered to the app. Every
# earlier tap of this same button in this flow happens with only 4 events, safely above that zone, so this is the
# first time the flow has ever scrolled to it at the full 5-event cap. `centerElement: true` keeps it clear of the
# inset regardless of how many events are showing.
- tapOn:
    id: view_log
- assertVisible: Family car log
- assertVisible:
    id: event_note_icon
# Tapping a row opens its details (add-event-details-view): the full moment, figure and note, and back returns to
# the list that opened it (the full log, here).
- tapOn:
    id: event_note_icon
- assertVisible:
    id: event_details_title
    text: Distance
- assertVisible:
    id: event_details_figure
    text: +1.0 km
- assertVisible:
    id: event_details_note
    text: borrowed to Sam
- tapOn:
    id: back
# A generous wait rather than a plain assertVisible: back navigation crossfades the details screen out over the
# full log underneath (confirmed harmless with screenshots — a normal transition, not a stuck state), and a longer
# timeout here is cheap insurance against that settling slower under load.
- extendedWaitUntil:
    visible: Family car log
    timeout: 10000
# Editing an already-saved event's note (add-event-editing): change it, then clear it, and confirm the row's note
# icon disappears once nothing is left to show. The details screen is still open from the case above.
- tapOn:
    id: event_note_icon
- tapOn:
    id: edit_event
- assertVisible: borrowed to Sam
- eraseText: 20
- inputText: lent to a friend
- tapOn:
    id: back
- assertVisible:
    id: event_details_note
    text: lent to a friend
- tapOn:
    id: edit_event
- assertVisible: lent to a friend
- eraseText: 20
- tapOn:
    id: back
- assertNotVisible:
    id: event_details_note
- tapOn:
    id: back
- extendedWaitUntil:
    visible: Family car log
    timeout: 10000
- assertNotVisible:
    id: event_note_icon
- tapOn:
    id: back
# A new odometer count lower than the current one (confirm-lower-odometer): current odometer is 45,321.8 km here
# (45,200.3 initial + 100.5 + 20.0 + 1.0; the earlier "yesterday" +10.0 km entry is dated before the initial odometer
# and so does not chain into the running total). Cancelling the confirmation changes nothing; confirming saves the
# lower count as the new odometer, and a later trip distance builds on it.
- assertVisible:
    id: current_odometer
    text: 45,321.8 km
- tapOn:
    id: log_event
- tapOn:
    id: log_way_odometer
- tapOn:
    id: odo_field
- inputText: "440000"
- hideKeyboard
- tapOn:
    id: save_entry
- assertVisible: "Save 44,000.0 km?"
- assertVisible: "That's lower than the vehicle's last known odometer, 45,321.8 km."
- tapOn: Cancel
- assertNotVisible: "Save 44,000.0 km?"
- tapOn:
    id: back
- assertVisible:
    id: current_odometer
    text: 45,321.8 km
- tapOn:
    id: log_event
- tapOn:
    id: log_way_odometer
- tapOn:
    id: odo_field
- inputText: "440000"
- hideKeyboard
- tapOn:
    id: save_entry
- assertVisible: "Save 44,000.0 km?"
- tapOn: Save anyway
- assertVisible:
    id: current_odometer
    text: 44,000.0 km
- tapOn:
    id: log_event
- tapOn:
    id: odo_field
- inputText: "500"
- hideKeyboard
- tapOn:
    id: save_entry
- assertVisible:
    id: current_odometer
    text: 44,050.0 km
