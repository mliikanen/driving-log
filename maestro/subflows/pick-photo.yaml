# Taps the vehicle picture on the add or edit screen, which opens the system chooser of where the photo comes from, chooses the
# "Media" app (the system's media picker, which is what this emulator image lists for images, next to "Camera") and the first photo in
# it (or, with the env PHOTO_INDEX, the photo at that position of the picker: 0 is the first). The crop screen is then open. The photos must have been added with addMedia
# (each area's setup.yaml does it once). The chooser, the picker and the crop screen are
# other windows, which do not expose test tags, so they are driven by text.
#
# The picker lists a new photo only once the system has indexed it, which for a JPEG can take longer than the picker stays fresh (it then says "No photos or
# videos"), so the steps are retried: each attempt first closes what an earlier one left open, then opens the chooser and the picker again.
appId: com.mikonoma.drivinglog
---
- retry:
    maxRetries: 3
    commands:
      # An earlier attempt may have left the picker or the chooser open (they are other windows, so the picture is then not on screen): close them.
      - runFlow:
          when:
            notVisible:
              id: picture_preview
          commands:
            - pressKey: back
      - runFlow:
          when:
            notVisible:
              id: picture_preview
          commands:
            - pressKey: back
      - tapOn:
          id: picture_preview
      - extendedWaitUntil:
          visible: Media
          timeout: 20000
      - tapOn: Media
      - extendedWaitUntil:
          visible: "Photo taken on.*"
          timeout: 12000
- evalScript: "${output.photoIndex = (typeof PHOTO_INDEX === 'undefined') ? 0 : PHOTO_INDEX}"
- tapOn:
    text: "Photo taken on.*"
    index: ${output.photoIndex}
- extendedWaitUntil:
    visible: Use photo
    timeout: 20000
