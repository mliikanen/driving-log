# Adds a vehicle from the vehicle list. Env: NAME, PLATE (may be empty), UNIT (a unit_<CODE> id such as
# unit_KILOMETERS), ODOMETER (digits, required: the odometer cannot be left empty, "0" is a valid reading).
appId: com.mikonoma.drivinglog
---
- tapOn:
    id: add_vehicle
- tapOn:
    id: vehicle_name
- inputText: ${NAME}
- runFlow:
    when:
      true: ${PLATE.length > 0}
    commands:
      - tapOn:
          id: vehicle_plate
      - inputText: ${PLATE}
- hideKeyboard
- tapOn:
    id: ${UNIT}
- tapOn:
    id: odo_field
- inputText: ${ODOMETER}
- hideKeyboard
- tapOn:
    id: save_vehicle
# Wait for the list: the add screen is still on screen while it navigates away.
- assertVisible:
    id: add_vehicle
