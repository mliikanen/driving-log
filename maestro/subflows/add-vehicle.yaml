# Adds a vehicle, from the Home screen or from the vehicle list, and ends on the vehicle list. From the Home screen the first tile is used: with no vehicle it is "Add vehicle" and
# opens the add screen straight away (after saving the app is on the Home screen again, so the list is then opened); with vehicles it opens the list, whose button is tapped. Env: NAME, PLATE (may be empty), UNIT (a unit_<CODE> id such as
# unit_KILOMETERS), ODOMETER (digits, required: the odometer cannot be left empty, "0" is a valid reading),
# TYPE (optional, a vehicle type code such as MOTORCYCLE; when not given the preselected Car is kept),
# COLOR (optional, a preset's RRGGBB code such as E53935; when not given the preselected default color is kept),
# PICTURE (optional, any value: the first photo of the system picker is chosen and cropped; the photo must be on the device, see the area's setup.yaml).
appId: com.mikonoma.drivinglog
---
- evalScript: "${output.emptyRoute = false}"
- runFlow:
    when:
      visible:
        id: landing_vehicles
    commands:
      # The tile's label is a text of its own: "Add vehicle" only while the user has no vehicle.
      - runFlow:
          when:
            visible: Add vehicle
          commands:
            - evalScript: "${output.emptyRoute = true}"
      - tapOn:
          id: landing_vehicles
# On the vehicle list (opened just now or already there) the add button is tapped; from an empty Home screen the add screen is already open.
- runFlow:
    when:
      true: ${!output.emptyRoute}
    commands:
      - tapOn:
          id: add_vehicle
- evalScript: "${output.withPicture = (typeof PICTURE === 'undefined') ? '' : PICTURE}"
- runFlow:
    when:
      true: ${output.withPicture.length > 0}
    commands:
      - runFlow: pick-photo.yaml
      - tapOn: Use photo
- tapOn:
    id: vehicle_name
- inputText: ${NAME}
- runFlow:
    when:
      true: ${PLATE.length > 0}
    commands:
      - tapOn:
          id: vehicle_plate
      - inputText: ${PLATE}
- hideKeyboard
- evalScript: "${output.vehicleType = (typeof TYPE === 'undefined') ? '' : TYPE}"
- runFlow:
    when:
      true: ${output.vehicleType.length > 0}
    commands:
      - tapOn:
          id: vehicle_type_${output.vehicleType}
- evalScript: "${output.vehicleColor = (typeof COLOR === 'undefined') ? '' : COLOR}"
- runFlow:
    when:
      true: ${output.vehicleColor.length > 0}
    commands:
      - scrollUntilVisible:
          element:
            id: vehicle_color_${output.vehicleColor}
      - tapOn:
          id: vehicle_color_${output.vehicleColor}
# The unit choice is above the type, fuel type and color choices, which the optional steps above may have scrolled past:
# bring it back into the middle of the screen before tapping it (at the very edge a tap can land in the gesture bar).
- scrollUntilVisible:
    element:
      id: ${UNIT}
    direction: UP
    centerElement: true
- tapOn:
    id: ${UNIT}
- scrollUntilVisible:
    element:
      id: odo_field
    centerElement: true
- tapOn:
    id: odo_field
- inputText: ${ODOMETER}
- hideKeyboard
- tapOn:
    id: save_vehicle
# Wait for the list: the add screen is still on screen while it navigates away. After the empty Home screen route the Home screen comes back instead: open the list from it.
- runFlow:
    when:
      true: ${output.emptyRoute}
    commands:
      - assertVisible:
          id: landing_vehicles
      - tapOn:
          id: landing_vehicles
- assertVisible:
    id: add_vehicle
