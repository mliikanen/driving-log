# The vehicle list: empty state, add action, and alphabetical order that ignores letter case.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- assertVisible: No vehicles yet
- assertVisible:
    id: add_vehicle
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: van
      TYPE: VAN
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Bike
      TYPE: MOTORCYCLE
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Family car
      TYPE: CAR
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
- assertNotVisible: No vehicles yet
- assertVisible:
    text: Family car
    below: Bike
- assertVisible:
    text: van
    below: Family car
# Each item shows the icon of its type.
- assertVisible: "Vehicle type: Motorcycle"
- assertVisible: "Vehicle type: Car"
- assertVisible: "Vehicle type: Van"
# Duplicate names are allowed.
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: van
      TYPE: VAN
      PLATE: ""
      UNIT: unit_KILOMETERS
      ODOMETER: "1"
- assertVisible:
    id: vehicle_item
    index: 3
