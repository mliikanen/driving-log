# Add a vehicle with a name, plate, unit and odometer, then check the list and the details.
# Run with the emulator locale English (United States): readings are checked with "," thousands separators.
appId: com.mikonoma.drivinglog
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/add-vehicle.yaml
    env:
      NAME: Family car
      PLATE: ABC-123
      UNIT: unit_KILOMETERS
      ODOMETER: "45200"
- assertVisible: Family car
- assertVisible: ABC-123
- tapOn: Family car
- assertVisible:
    id: vehicle_title
    text: Family car
- assertVisible:
    id: vehicle_plate
    text: ABC-123
- assertVisible:
    id: current_odometer
    text: 45,200 km
