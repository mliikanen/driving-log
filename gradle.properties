org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
kotlin.native.ignoreDisabledTargets=true

# add-app-distribution: not secrets (the Firebase App ID is visible in console URLs and every distributed APK's
# manifest anyway; the tester group name is just a label) — see design.md's signing/appId decision.
firebaseAppId=1:892237737183:android:024f21b3af486575294d6a
firebaseTesterGroup=testers

# fix-build-warnings: a Gradle or plugin deprecation fails the build instead of scrolling past (docs/code-quality.md),
# and so does a warning from compiling the build scripts themselves.
org.gradle.warning.mode=fail
org.gradle.kotlin.dsl.allWarningsAsErrors=true
