# detekt configuration (add-lint-quality-gates; see docs/code-quality.md). Builds on detekt's defaults
# (`buildUponDefaultConfig`): only overrides are listed, each with the convention it follows.
# Test source sets: this project's are commonTest, androidHostTest and iosTest (plus the app's test/androidTest).

complexity:
  CyclomaticComplexMethod:
    # A processor's `map` is a `when` over intents with one call per branch; that's dispatch, not complexity.
    ignoreSimpleWhenEntries: true
  LargeClass:
    # Test classes grow with their cases.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/androidHostTest/**', '**/iosTest/**']
  LongParameterList:
    # Compose screens and components take their state and callbacks as parameters by design (MVI).
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Test classes have one function per case.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/androidHostTest/**', '**/iosTest/**']

naming:
  FunctionNaming:
    # Compose functions are PascalCase; test names may be descriptive.
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/androidHostTest/**', '**/iosTest/**']

style:
  DestructuringDeclarationWithTooManyEntries:
    # `val (l, t, r, b) = box` is the clearest way to read a box in a test.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/androidHostTest/**', '**/iosTest/**']
  ReturnCount:
    # Processors and validators return early on each invalid input (the project's MVI style); guard clauses at the top of
    # a function don't count, and a function may have up to three other returns.
    excludeGuardClauses: true
    max: 3
  MagicNumber:
    # Compose code is full of dp/sp sizes, tones and animation durations that read best inline; tests use literal
    # inputs and expected values.
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/androidHostTest/**', '**/iosTest/**', '**/*.kts']
  MaxLineLength:
    # ktlint's max-line-length reports these (160, .editorconfig); one tool per finding.
    active: false
  UnusedPrivateFunction:
    # @Preview functions are used by the IDE, not by code.
    ignoreAnnotated: ['Preview']
  WildcardImport:
    # ktlint's no-wildcard-imports reports these; one tool per finding.
    active: false
