# Throwaway (add-ci-workflows task 4.6): checks that a pull request can't reach the release secrets. Never merged.
name: Probe secrets
on: pull_request
permissions:
  contents: read
jobs:
  without-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Is the release secret visible?
        env:
          PROBE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: if [ -z "$PROBE" ]; then echo "PROBE-RESULT secret empty"; else echo "PROBE-RESULT secret VISIBLE"; fi
  in-environment:
    runs-on: ubuntu-latest
    environment: firebase-deployment
    steps:
      - name: Entered the environment
        env:
          PROBE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: if [ -z "$PROBE" ]; then echo "PROBE-RESULT secret empty"; else echo "PROBE-RESULT secret VISIBLE"; fi
