schema: spec-driven

# Project context shown to the AI when it creates proposals, specs, designs and tasks.
context: |
  Driving Log: a Kotlin Multiplatform app (Android + iOS) for recording trips
  and reporting mileage. Key feature is to allow using device camera for capturing
  trip distances (either by looking at trip meter, or odometer) and refueling amounts,
  again by pointing camera at fuel pump to identify amount refueled and cost of the refueling.
  Also identify type of fuel, and unit cost of the fuel, if possible with the camera. Also
  taking a picture of a receipt shall be possible to get this information. Whenever refueling
  is being added, also prompt user to include mileage (either odo or trip) at the refueling time.

  User can add any number of vehicles. History is associated independently to each vehicle.
  When adding mileage/refueling info, app shall attempt to identify vehicle automatically.
  Odometer amount matching is the primary method; fuzzy matching of dashboard or vehicle pictures are
  other potential methods for vehicle identification when odo is not reliably available.
  Users shall be able to share vehicles with other users by inviting them to contribute to the vehicle, or revoke
  this access. Vehicles cannot be deleted from the system. Users can hide (and restore) vehicles they have access to.
  Hidden vehicles are not to be used as candidates when automatically detecting vehicles, or included in any UIs
  other than one used for restoring the access.

  User must be able to select either US style (miles/gallons/mpg) or international style (km, liter, l/km). This is a per-user
  setting which can be overridden per-vehicle for odometer/trip reading. Gallon vs liter detection should be attempted with fuel pump
  or receipt pictures; if detection fails, user shall be able to toggle unit at the time of adding refueling event.

  User shall be able to store also other contextual data to the diary (e.g. text, pictures, maintenance done, etc...)

  Data storage should be uniform (in international units: meters for distances, liters for fuel amounts) and any unit conversions
  are to be done only at the presentation layer.

  The app shall be offline-first. After the initial login, the app MUST remain fully usable without a network
  connection; all reads and writes go to local storage first and are synchronized with the backend when connectivity
  is available. When synchronization finds conflicting data, the backend data always wins. The user with the
  conflicting local data shall be prompted to either overwrite the local data with the backend version or delete the
  conflicting local data.

  The data model shall be additive, not accumulative: every trip, odometer reading, refueling and diary entry is stored
  as its own record, and records are only added, never merged into running totals. Aggregates (totals, averages,
  consumption) are derived from the records when needed and are not stored.

  Each vehicle has its own odometer unit (kilometers, kilometers with 100 m, miles, or miles with tenths), chosen when the
  vehicle is added. Until the user-level unit preference exists, the default is derived from the device region. The
  odometer is entered in a microwave-style number field (system number keyboard) where digits enter from the right, and
  numbers are rendered with the device locale's separators. Data storage stays locale-agnostic (meters, enum codes).

  Driving is logged as distance entries on a vehicle: from the details screen the user records a trip distance, or a new
  odometer count (the distance is the count minus the previous known odometer at that time). A vehicle's current odometer
  is derived, never stored: it is the latest odometer-setting event (the initial odometer, or an odometer anchor, which is what
  a new odometer count becomes when no odometer is known at its time) plus the distances logged after it. Trips (spans of
  time with a start and an end that group distance and refueling entries) are a separate, upcoming change.

  Every date and time a user enters or sees is stored with its time zone (the instant, the IANA zone id and the zone's UTC
  offset then) and is shown in the zone it was entered in, whatever the device's zone is later, until the user chooses
  otherwise. Wherever a screen lets the user choose a date and time it also lets them choose the time zone. Times and weekday
  names follow the device: the system's 12-hour or 24-hour setting and the device language.

  Use Material Design 3 as app design system.

  Android is the primary target platform which MUST contain all required functionality, iOS is opportunistic target.
  Whenever there are differences in the app behavior on platforms, note the differences in the relevant feature specifications.
  The minimum supported Android version is Android 13 (API 33), which is what the Kide library requires.

  Firebase app distribution is to be used to distribute app test builds. No real app stores are used yet for distribution.

  Tech stack:
  - Kotlin Multiplatform, Compose Multiplatform UI (shared in `shared/`)
  - Android app shell in `androidApp/`, iOS app shell in `iosApp/`
  - Gradle Kotlin DSL, version catalog in `gradle/libs.versions.toml`
  - kotlinx-coroutines, kotlinx-datetime
  - Model-view-intent: Kide (Fuusio) - https://github.com/Fuusio/kide, with kide-navigation (Navigation 3) for screens
  - Local storage: SQLDelight (SQLite) until Firestore sync exists; stored values are locale-agnostic
  - kotlinx-serialization for persisted screen state
  - Dependency injection: Metro - https://github.com/zacsweers/metro
  - Firebase for user accounts and data storage.
  - Tests: kotlin.test in `commonTest`; keep business logic in common code. Avoid tests requiring real device / emulator / simulator.
  - Robolectric for Android integration tests.
  - Maestro for instrumentation tests.
  - ML Kit for OCR
  - GitHub

  Conventions:
  - Package root: `com.mikonoma.drivinglog`
  - Business logic lives in commonMain; platform code (location, storage
    drivers, permissions) goes behind `expect`/`actual` or interfaces
  - Specs describe observable behavior, not implementation
  - Every place a user enters an odometer reading uses the shared `OdometerField` composable and `OdometerEntry` model,
    so entry behavior is identical everywhere (empty start, right-edge fill, kept leading zero, backspace order, locale
    separators). A screen's processor forwards the field's text to `OdometerEntry.applyEdit` and never re-implements a
    rule; a screen only decides whether an empty entry may be saved.
  - MVI architecture.

# Per-artifact rules.
rules:
  proposal:
    - State the user-visible problem and the scope, including what is out of scope
  specs:
    - Use "The system SHALL ..." requirements, each with at least one scenario
    - Note platform differences (Android vs iOS) explicitly when behavior differs
  tasks:
    - Keep tasks small enough to complete and verify in one sitting
    - Include test tasks for each requirement
