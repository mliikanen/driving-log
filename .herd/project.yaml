# Herd manifest for Driving Log. DRAFT: the herd isn't built yet; `herd init` validates this file during
# onboarding. Format and semantics: https://github.com/mliikanen/herd/blob/main/docs/design.md
# People's workflow: docs/change-workflow.md.
# The herd reads this file from `main` only, and its agents can't change it.
workflow: openspec
branch_prefix: change/

toolchain:
  # Ubuntu-based, JDK 25 + the Android SDK platform and build-tools the Gradle build asks for. Nothing else:
  # git and the openspec CLI come with the herd's role layer.
  dockerfile: .herd/toolchain.Dockerfile
  # Kept between units instead of re-downloaded by each: the Gradle home (wrapper, dependencies, build cache;
  # about 2 GB) and the Kotlin/Native toolchain that the iOS targets pull in even on Linux (~/.konan, about 800 MB).
  # Revisit if one ever causes a non-reproducible build.
  caches: [/home/agent/.gradle, /home/agent/.konan]
  # Measured in a worker-like run. The Gradle wrapper download redirects from services.gradle.org to GitHub's
  # release assets, and the plugin portal serves from plugins-artifacts.gradle.org.
  egress: [repo.maven.apache.org, maven.google.com, dl.google.com, plugins.gradle.org, plugins-artifacts.gradle.org,
           repo.gradle.org, services.gradle.org, github.com, release-assets.githubusercontent.com]

# CLAUDE.md's final regression run, without Maestro. assembleDebug builds the production flavor too, which needs a
# google-services.json: the placeholder CI uses (no secrets) unless one is already there.
gate:
  - test -f androidApp/src/production/google-services.json || cp .github/ci/google-services.placeholder.json androidApp/src/production/google-services.json
  - ./gradlew :shared:allTests :androidApp:assembleDebug codeQuality
  - openspec validate --all --strict

# Copilot reviews every PR and again a few minutes after each push (about 2 to 4 minutes so far). Review is done
# only once it has reviewed the current tip; 15 minutes leaves room for a slow round.
#
# Maestro runs as your check in PR review, for now: there's no e2e block (and so no final_approval, which
# defaults to none) until a harness for running the flows on an emulator in a worker exists. Then add the block and
# final_approval: { kind: container }, and keep this check for what only a real device can judge.
pr_review:
  wait_for: [copilot-pull-request-reviewer]
  timeout: 15m
  human_check:
    reviewers: [mliikanen]
    instructions: |
      Check out this PR's branch (gh pr checkout <number>), then build and install the fake flavor
      (./gradlew :androidApp:assembleFakeDebug, then adb install -r
      androidApp/build/outputs/apk/fake/debug/androidApp-fake-debug.apk) and run the Maestro manifests of the
      areas this change touches: maestro/run.sh <area>... (CLAUDE.md lists the areas). Approve if they pass; if a
      flow fails, run /herd-resolve, which submits a Request changes review with the failing flow and what happened.

# v1 is Android only.
missing_capabilities:
  - macOS / Xcode (iosApp, iOS targets)
  - a physical Android device
  - real Firebase / Google Sign-In (production flavor)

# pr_review_rounds bounds the GitHub review rounds; tasks added during review count toward it, not added_tasks.
# PR #7 (add-open-source-license) took five Copilot rounds to come clean.
caps: { review_rounds: 3, added_tasks: 3, gate_fixes: 3, pr_review_rounds: 5 }

# No prompt additions: CLAUDE.md, docs/test-strategy.md and openspec/config.yaml carry the conventions. Add
# .herd/implementer.md / reviewer.md only for something agents get wrong repeatedly that doesn't belong in CLAUDE.md.

# The Firebase publish job lifts the PR body's "Release notes" section (docs/app-distribution.md).
release_notes: true
